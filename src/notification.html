<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos Notification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #18181b;
      color: white;
      height: 100vh;
      overflow: hidden;
    }
    
    .notification {
      height: 100%;
      display: flex;
      flex-direction: column;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(100%);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header.task {
      background: linear-gradient(135deg, #166534 0%, #15803d 100%);
    }
    
    .header.email {
      background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .icon {
      width: 20px;
      height: 20px;
    }
    
    .header-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    .close-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .content {
      flex: 1;
      padding: 16px;
      overflow: hidden;
    }
    
    .title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    
    .body {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .footer {
      padding: 10px 16px;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    .pulse.task { background: #22c55e; }
    .pulse.email { background: #3b82f6; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .brand-text {
      font-size: 10px;
      color: #71717a;
      font-weight: 500;
      letter-spacing: 1px;
    }
    
    .dismiss-btn {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    
    .dismiss-btn:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <div class="header" id="header">
      <div class="header-left">
        <svg class="icon" id="icon-task" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <svg class="icon" id="icon-email" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" style="display:none">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span class="header-title" id="header-title">Task Created</span>
      </div>
      <button class="close-btn" onclick="closeWindow()">×</button>
    </div>
    
    <div class="content">
      <h3 class="title" id="title">Loading...</h3>
      <p class="body" id="body"></p>
    </div>
    
    <div class="footer">
      <div class="brand">
        <div class="pulse task" id="pulse"></div>
        <span class="brand-text">KAIROS</span>
      </div>
      <button class="dismiss-btn" onclick="closeWindow()">Dismiss</button>
    </div>
  </div>

  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'task';
    const title = decodeURIComponent(params.get('title') || 'Notification');
    const body = decodeURIComponent(params.get('body') || '');
    const duration = parseInt(params.get('duration') || '10') * 1000;

    // Set content
    document.getElementById('title').textContent = title;
    document.getElementById('body').textContent = body;

    const header = document.getElementById('header');
    const headerTitle = document.getElementById('header-title');
    const iconTask = document.getElementById('icon-task');
    const iconEmail = document.getElementById('icon-email');
    const pulse = document.getElementById('pulse');

    if (type === 'email') {
      header.className = 'header email';
      headerTitle.textContent = 'New Email';
      iconTask.style.display = 'none';
      iconEmail.style.display = 'block';
      pulse.className = 'pulse email';
    }

    // Auto-close
    if (duration > 0) {
      setTimeout(closeWindow, duration);
    }

    // Close function using Tauri API
    async function closeWindow() {
      document.getElementById('notification').style.animation = 'slideIn 0.2s ease-in reverse';
      setTimeout(async () => {
        try {
          const { getCurrentWindow } = await import('https://unpkg.com/@tauri-apps/api@2/window');
          await getCurrentWindow().close();
        } catch (e) {
          window.close();
        }
      }, 200);
    }
  </script>
</body>
</html>
