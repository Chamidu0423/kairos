[package]
name = "kairos"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri Core (FIXED: Removed invalid v1 features) ---
tauri = { version = "2", features = [] }

# --- Plugins (Notifications & Shell are handled here now) ---
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Database (SQLite) ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Network & AI ---
reqwest = { version = "0.12", features = ["json", "blocking"] }

# --- Email Handling ---
imap = "2.4"
mailparse = "0.15"
native-tls = "0.2"

# --- Utilities ---
keyring = "3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
